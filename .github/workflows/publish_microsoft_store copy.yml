name: Publish Microsoft Store Copy
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish_windows_release:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: microsoft/setup-msstore-cli@v1.3
      - run: msstore reconfigure --tenantId ${{ secrets.PARTNER_CENTER_TENANT_ID }} --sellerId ${{ secrets.PARTNER_CENTER_SELLER_ID }} --clientId ${{ secrets.PARTNER_CENTER_CLIENT_ID }} --clientSecret ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Generate Windows release notes metadata
        run: dart distribution/windows/generate_windows_release_notes.dart --version=1.14.0
        
      - name: Generate build_runner files
        run: dart run build_runner build -d
        
      - name: Create MSIX package
        run: msstore package .

      - name: Update Microsoft Store submission metadata
        shell: pwsh
        env:
          MS_STORE_APP_ID: ${{ secrets.MS_STORE_APP_ID }}
        run: |
          $releaseNotes = Get-Content -Raw .\distribution\windows\update_metadata.json | ConvertFrom-Json -AsHashtable
          $metadata = $null

          try {
            $currentSubmissionText = & msstore submission get $env:MS_STORE_APP_ID --verbose 2>&1 | Out-String
            $currentSubmissionText = $currentSubmissionText -replace '\e\[[0-9;]*m', ''

            $jsonStart = $currentSubmissionText.IndexOf('{')
            $jsonEnd = $currentSubmissionText.LastIndexOf('}')

            if ($jsonStart -ge 0 -and $jsonEnd -gt $jsonStart) {
              $currentSubmissionJson = $currentSubmissionText.Substring($jsonStart, $jsonEnd - $jsonStart + 1)
              $submission = $currentSubmissionJson | ConvertFrom-Json -AsHashtable

              if (-not $submission.ContainsKey('Listings')) {
                $submission['Listings'] = @{}
              }

              $submission['ApplicationCategory'] = 'Education_StudyAids'
              
              if ($releaseNotes.ContainsKey('Pricing')) {
                $submission['Pricing'] = $releaseNotes.Pricing
              }
              
              if ($releaseNotes.ContainsKey('AllowTargetFutureDeviceFamilies')) {
                $submission['AllowTargetFutureDeviceFamilies'] = $releaseNotes.AllowTargetFutureDeviceFamilies
              }

              foreach ($locale in $releaseNotes.Listings.Keys) {
                if (-not $submission['Listings'].ContainsKey($locale)) {
                  $submission['Listings'][$locale] = @{}
                }

                if (-not $submission['Listings'][$locale].ContainsKey('BaseListing')) {
                  $submission['Listings'][$locale]['BaseListing'] = @{}
                }

                $submission['Listings'][$locale]['BaseListing']['ReleaseNotes'] = $releaseNotes.Listings[$locale].BaseListing.ReleaseNotes
              }

              $metadata = $submission | ConvertTo-Json -Depth 20 -Compress
            }
          }
          catch {
            Write-Host "Aviso: Failed to parse the API response, using the complete Dart payload."
            $metadata = $null
          }

          if ([string]::IsNullOrWhiteSpace($metadata)) {
            $metadata = $releaseNotes | ConvertTo-Json -Depth 20 -Compress
          }

          $updateMetadataOutput = & msstore submission updateMetadata $env:MS_STORE_APP_ID $metadata --verbose 2>&1
          $updateMetadataOutput | ForEach-Object { Write-Host $_ }

          if ($LASTEXITCODE -ne 0) {
            Write-Host "UpdateMetadata payload used: $metadata"
            exit $LASTEXITCODE
          }
      - name: Publish MSIX to the Microsoft Store
        run: msstore publish --appId ${{ secrets.MS_STORE_APP_ID }} -v
