name: Publish Microsoft Store
on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - feat/automated-release-notes
  workflow_dispatch:

jobs:
  publish_windows_release:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: microsoft/setup-msstore-cli@v1.3
      - run: msstore reconfigure --tenantId ${{ secrets.PARTNER_CENTER_TENANT_ID }} --sellerId ${{ secrets.PARTNER_CENTER_SELLER_ID }} --clientId ${{ secrets.PARTNER_CENTER_CLIENT_ID }} --clientSecret ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Generate Windows release notes metadata
        run: dart distribution/windows/generate_windows_release_notes.dart --version=1.14.0

      - name: Generate build_runner files
        run: dart run build_runner build -d

      - name: Create MSIX package
        run: msstore package .

      - name: Update Microsoft Store submission metadata
        shell: pwsh
        env:
          MS_STORE_APP_ID: ${{ secrets.MS_STORE_APP_ID }}
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          $releaseNotes = Get-Content -Raw .\distribution\windows\update_metadata.json | ConvertFrom-Json -AsHashtable

          function New-SubmissionPayload {
            param(
              [hashtable]$SourceSubmission,
              [hashtable]$ReleaseNotesPayload
            )

            $sanitizedListings = @{}
            foreach ($locale in $SourceSubmission.Listings.Keys) {
              $listing = $SourceSubmission.Listings[$locale]
              $baseListing = $listing.BaseListing
              $sanitizedListings[$locale] = @{
                BaseListing = @{
                  Keywords = $baseListing.Keywords
                  Description = $baseListing.Description
                  Features = $baseListing.Features
                  ReleaseNotes = $baseListing.ReleaseNotes
                  Images = @(
                    foreach ($image in ($baseListing.Images | ForEach-Object { $_ })) {
                      @{
                        FileName = $image.FileName
                        FileStatus = $image.FileStatus
                        Id = $image.Id
                        ImageType = $image.ImageType
                      }
                    }
                  )
                  RecommendedHardware = $baseListing.RecommendedHardware
                  MinimumHardware = $baseListing.MinimumHardware
                  Title = $baseListing.Title
                  LicenseTerms = $baseListing.LicenseTerms
                  CopyrightAndTrademarkInfo = $baseListing.CopyrightAndTrademarkInfo
                  ShortDescription = $baseListing.ShortDescription
                  ShortTitle = $baseListing.ShortTitle
                  VoiceTitle = $baseListing.VoiceTitle
                  DevStudio = $baseListing.DevStudio
                }
                PlatformOverrides = $listing.PlatformOverrides
              }
            }

            $sanitizedApplicationPackages = @(
              foreach ($package in @($SourceSubmission.ApplicationPackages)) {
                @{
                  FileName = $package.FileName
                  FileStatus = $package.FileStatus
                  Id = $package.Id
                  Version = $package.Version
                  Architecture = $package.Architecture
                  Languages = $package.Languages
                  Capabilities = $package.Capabilities
                  MinimumDirectXVersion = $package.MinimumDirectXVersion
                  MinimumSystemRam = $package.MinimumSystemRam
                }
              }
            )

            $sanitizedGamingOptions = @(
              foreach ($option in @($SourceSubmission.GamingOptions)) {
                @{
                  Genres = $option.Genres
                  IsLocalMultiplayer = [bool]$option.IsLocalMultiplayer
                  IsLocalCooperative = [bool]$option.IsLocalCooperative
                  IsOnlineMultiplayer = [bool]$option.IsOnlineMultiplayer
                  IsOnlineCooperative = [bool]$option.IsOnlineCooperative
                  IsBroadcastingPrivilegeGranted = [bool]$option.IsBroadcastingPrivilegeGranted
                  IsCrossPlayEnabled = [bool]$option.IsCrossPlayEnabled
                  KinectDataForExternal = $option.KinectDataForExternal
                }
              }
            )

            $sanitizedTrailers = @(
              foreach ($trailer in @($SourceSubmission.Trailers)) {
                @{
                  Id = $trailer.Id
                  VideoFileName = $trailer.VideoFileName
                  VideoFileId = $trailer.VideoFileId
                  TrailerAssets = $trailer.TrailerAssets
                }
              }
            )

            $sanitizedPackageDeliveryOptions = $null
            if ($null -ne $SourceSubmission.PackageDeliveryOptions) {
              $packageRollout = $SourceSubmission.PackageDeliveryOptions.PackageRollout
              $sanitizedPackageRollout = $null
              if ($null -ne $packageRollout) {
                $sanitizedPackageRollout = @{
                  IsPackageRollout = [bool]$packageRollout.IsPackageRollout
                  PackageRolloutPercentage = [float]$packageRollout.PackageRolloutPercentage
                  PackageRolloutStatus = $packageRollout.PackageRolloutStatus
                  FallbackSubmissionId = $packageRollout.FallbackSubmissionId
                }
              }

              $sanitizedPackageDeliveryOptions = @{
                PackageRollout = $sanitizedPackageRollout
                IsMandatoryUpdate = [bool]$SourceSubmission.PackageDeliveryOptions.IsMandatoryUpdate
                MandatoryUpdateEffectiveDate = $SourceSubmission.PackageDeliveryOptions.MandatoryUpdateEffectiveDate
              }
            }

            $sanitizedPricing = $null
            if ($null -ne $SourceSubmission.Pricing) {
              $sanitizedPricing = @{
                TrialPeriod = $SourceSubmission.Pricing.TrialPeriod
                MarketSpecificPricings = $SourceSubmission.Pricing.MarketSpecificPricings
                PriceId = $SourceSubmission.Pricing.PriceId
                IsAdvancedPricingModel = [bool]$SourceSubmission.Pricing.IsAdvancedPricingModel
              }
            }

            return @{
              Id = $SourceSubmission.Id
              ApplicationCategory = $SourceSubmission.ApplicationCategory
              Pricing = $sanitizedPricing
              Visibility = $SourceSubmission.Visibility
              TargetPublishMode = $SourceSubmission.TargetPublishMode
              TargetPublishDate = $SourceSubmission.TargetPublishDate
              Listings = $sanitizedListings
              HardwarePreferences = $SourceSubmission.HardwarePreferences
              AutomaticBackupEnabled = [bool]$SourceSubmission.AutomaticBackupEnabled
              CanInstallOnRemovableMedia = [bool]$SourceSubmission.CanInstallOnRemovableMedia
              IsGameDvrEnabled = [bool]$SourceSubmission.IsGameDvrEnabled
              GamingOptions = $sanitizedGamingOptions
              HasExternalInAppProducts = [bool]$SourceSubmission.HasExternalInAppProducts
              MeetAccessibilityGuidelines = [bool]$SourceSubmission.MeetAccessibilityGuidelines
              NotesForCertification = $SourceSubmission.NotesForCertification
              ApplicationPackages = $sanitizedApplicationPackages
              PackageDeliveryOptions = $sanitizedPackageDeliveryOptions
              EnterpriseLicensing = $SourceSubmission.EnterpriseLicensing
              AllowMicrosoftDecideAppAvailabilityToFutureDeviceFamilies = [bool]$SourceSubmission.AllowMicrosoftDecideAppAvailabilityToFutureDeviceFamilies
              AllowTargetFutureDeviceFamilies = $SourceSubmission.AllowTargetFutureDeviceFamilies
              FriendlyName = $SourceSubmission.FriendlyName
              Trailers = $sanitizedTrailers
            }
          }

          $tokenResponse = Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/$($env:PARTNER_CENTER_TENANT_ID)/oauth2/v2.0/token" -ContentType 'application/x-www-form-urlencoded' -Body @{
            grant_type    = 'client_credentials'
            client_id     = $env:PARTNER_CENTER_CLIENT_ID
            client_secret = $env:PARTNER_CENTER_CLIENT_SECRET
            scope         = 'https://manage.devcenter.microsoft.com/.default'
          }

          $headers = @{
            Authorization  = "Bearer $($tokenResponse.access_token)"
            TenantId       = $env:PARTNER_CENTER_TENANT_ID
            'Content-Type' = 'application/json'
          }

          $apiBaseUrl = "https://manage.devcenter.microsoft.com/v1.0/my/applications/$($env:MS_STORE_APP_ID)"

          try {
            $application = Invoke-RestMethod -Method Get -Uri $apiBaseUrl -Headers $headers

            $submissionId = $null
            if ($application.PendingApplicationSubmission -and -not [string]::IsNullOrWhiteSpace($application.PendingApplicationSubmission.Id)) {
              $submissionId = $application.PendingApplicationSubmission.Id
            }

            if ([string]::IsNullOrWhiteSpace($submissionId)) {
              $createdSubmission = Invoke-RestMethod -Method Post -Uri "$apiBaseUrl/submissions?isMinimalResponse=true" -Headers $headers

              if ($createdSubmission.Id) {
                $submissionId = $createdSubmission.Id
              }
              elseif ($createdSubmission.id) {
                $submissionId = $createdSubmission.id
              }
            }

            if ([string]::IsNullOrWhiteSpace($submissionId)) {
              Write-Host "💥 Error: submission Id not found in the Dev Center response."
              exit 1
            }

            $currentSubmission = Invoke-RestMethod -Method Get -Uri "$apiBaseUrl/submissions/$submissionId" -Headers $headers
            $submission = $currentSubmission | ConvertTo-Json -Depth 20 | ConvertFrom-Json -AsHashtable

            $submission = New-SubmissionPayload -SourceSubmission $submission -ReleaseNotesPayload $releaseNotes

            if (-not $submission.ContainsKey('Listings')) {
              $submission['Listings'] = @{}
            }

            $submission['ApplicationCategory'] = 'Education_StudyAids'

            foreach ($locale in $releaseNotes.Listings.Keys) {
              if (-not $submission['Listings'].ContainsKey($locale)) {
                $submission['Listings'][$locale] = @{}
              }

              if (-not $submission['Listings'][$locale].ContainsKey('BaseListing')) {
                $submission['Listings'][$locale]['BaseListing'] = @{}
              }

              $submission['Listings'][$locale]['BaseListing']['ReleaseNotes'] = $releaseNotes.Listings[$locale].BaseListing.ReleaseNotes
            }

            $metadata = $submission | ConvertTo-Json -Depth 20 -Compress
            $bodyBytes = [System.Text.Encoding]::UTF8.GetBytes($metadata)

            Invoke-RestMethod -Method Put -Uri "$apiBaseUrl/submissions/$submissionId" -Headers $headers -Body $bodyBytes | Out-Null
            Write-Host "✅ Metadata successfully updated via direct Dev Center API."
          }
          catch {
            Write-Host "💥 Dev Center error: $($_.Exception.Message)"
            if ($metadata) {
              Write-Host "UpdateMetadata payload used: $metadata"
            }
            exit 1
          }

      - name: Publish MSIX to the Microsoft Store
        run: msstore publish --appId ${{ secrets.MS_STORE_APP_ID }} -v