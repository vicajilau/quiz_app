name: Publish Microsoft Store
on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - feat/automated-release-notes
  workflow_dispatch:

jobs:
  publish_windows_release:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: microsoft/setup-msstore-cli@v1.3
      - run: msstore reconfigure --tenantId ${{ secrets.PARTNER_CENTER_TENANT_ID }} --sellerId ${{ secrets.PARTNER_CENTER_SELLER_ID }} --clientId ${{ secrets.PARTNER_CENTER_CLIENT_ID }} --clientSecret ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Generate Windows release notes metadata
        run: dart distribution/windows/generate_windows_release_notes.dart --version=1.14.0
        
      - name: Generate build_runner files
        run: dart run build_runner build -d
        
      - name: Create MSIX package
        run: msstore package .

      - name: Update Microsoft Store submission metadata
        shell: pwsh
        env:
          MS_STORE_APP_ID: ${{ secrets.MS_STORE_APP_ID }}
        run: |
          $releaseNotes = Get-Content -Raw .\distribution\windows\update_metadata.json | ConvertFrom-Json -AsHashtable
          
          $rawOutput = & msstore submission get $env:MS_STORE_APP_ID
          $currentSubmissionText = $rawOutput -join ""
          $currentSubmissionText = $currentSubmissionText -replace '\x1B\[[0-9;]*m', ''

          $jsonStart = $currentSubmissionText.IndexOf('{')
          $jsonEnd = $currentSubmissionText.LastIndexOf('}')

          if ($jsonStart -ge 0 -and $jsonEnd -gt $jsonStart) {
            $currentSubmissionJson = $currentSubmissionText.Substring($jsonStart, $jsonEnd - $jsonStart + 1)
            
            try {
              $submission = $currentSubmissionJson | ConvertFrom-Json -AsHashtable

              if ($submission.ContainsKey('packages')) {
                $releaseNotes['Packages'] = $submission['packages']
              }

              $metadata = $releaseNotes | ConvertTo-Json -Depth 20 -Compress
            }
            catch {
              Write-Host "💥 Parsing error details: $($_.Exception.Message)"
              exit 1
            }
          } else {
            Write-Host "💥 Error: JSON structure not found in the response."
            exit 1
          }

          & msstore submission updateMetadata $env:MS_STORE_APP_ID $metadata --verbose

          if ($LASTEXITCODE -ne 0) {
            Write-Host "UpdateMetadata payload used: $metadata"
            exit $LASTEXITCODE
          }
          
      - name: Publish MSIX to the Microsoft Store
        run: msstore publish --appId ${{ secrets.MS_STORE_APP_ID }} -v